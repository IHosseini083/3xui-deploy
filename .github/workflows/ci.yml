name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify LF line endings
        run: |
          if grep -q $'\r' manage.sh; then
            echo "ERROR: manage.sh contains CRLF line endings"
            exit 1
          fi

      - name: Check bash syntax
        run: bash -n manage.sh

      - name: Run ShellCheck (advisory)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning manage.sh || true
          fi

      - name: Smoke test CLI help
        run: |
          chmod +x manage.sh
          ./manage.sh --help
