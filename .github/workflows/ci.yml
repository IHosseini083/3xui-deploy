name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify LF line endings
        run: |
          if grep -q $'\r' manage.sh tests/test_manage.sh; then
            echo "ERROR: shell scripts contain CRLF line endings"
            exit 1
          fi

      - name: Check bash syntax
        run: |
          bash -n manage.sh
          bash -n tests/test_manage.sh

      - name: Run ShellCheck (advisory)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning manage.sh tests/test_manage.sh || true
          fi

      - name: Run unit tests
        run: bash tests/test_manage.sh

      - name: Smoke test CLI help
        run: |
          chmod +x manage.sh
          ./manage.sh --help
