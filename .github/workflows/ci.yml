name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify LF line endings
        run: |
          if grep -q $'\r' VERSION CHANGELOG.md manage.sh tests/*.sh tests/*.py webpanel/*.py webpanel/static/* .github/workflows/*.yml; then
            echo "ERROR: source files contain CRLF line endings"
            exit 1
          fi

      - name: Verify version consistency
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: VERSION '$VER' is not valid SemVer"
            exit 1
          fi
          SCRIPT_VER=$(sed -n 's/^DEPLOY_VERSION="\([^"]*\)".*/\1/p' manage.sh | head -n 1)
          WP_VER=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' webpanel/__init__.py | head -n 1)
          if [[ "$SCRIPT_VER" != "$VER" || "$WP_VER" != "$VER" ]]; then
            echo "ERROR: Version mismatch: VERSION=$VER manage.sh=$SCRIPT_VER webpanel=$WP_VER"
            exit 1
          fi
          if ! grep -qF "## [v${VER}]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md is missing entry '## [v${VER}]'"
            exit 1
          fi
          chmod +x manage.sh
          OUT_VER=$(./manage.sh --version)
          if [[ "$OUT_VER" != "3xui-deploy v${VER}" ]]; then
            echo "ERROR: Unexpected './manage.sh --version' output: '$OUT_VER'"
            exit 1
          fi

      - name: Check bash syntax
        run: |
          bash -n manage.sh
          bash -n tests/test_manage.sh
          bash -n tests/test_compat.sh

      - name: Run ShellCheck (advisory)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning manage.sh tests/test_manage.sh tests/test_compat.sh || true
          fi

      - name: Run bash unit & compatibility tests
        run: |
          bash tests/test_manage.sh
          bash tests/test_compat.sh

      - name: Check Python syntax and run webpanel tests
        run: |
          python3 -m py_compile webpanel/__init__.py webpanel/auth.py webpanel/probe.py webpanel/ops.py webpanel/server.py tests/test_webpanel.py
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Smoke test CLI help
        run: |
          chmod +x manage.sh
          ./manage.sh --help
