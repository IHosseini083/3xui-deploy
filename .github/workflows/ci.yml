name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify LF line endings
        run: |
          if grep -q $'\r' manage.sh tests/test_manage.sh tests/test_compat.sh webpanel/*.py tests/test_webpanel.py; then
            echo "ERROR: source files contain CRLF line endings"
            exit 1
          fi

      - name: Check bash syntax
        run: |
          bash -n manage.sh
          bash -n tests/test_manage.sh
          bash -n tests/test_compat.sh

      - name: Run ShellCheck (advisory)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning manage.sh tests/test_manage.sh tests/test_compat.sh || true
          fi

      - name: Run bash unit & compatibility tests
        run: |
          bash tests/test_manage.sh
          bash tests/test_compat.sh

      - name: Check Python syntax and run webpanel tests
        run: |
          python3 -m py_compile webpanel/__init__.py webpanel/auth.py webpanel/probe.py webpanel/ops.py webpanel/server.py tests/test_webpanel.py
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Smoke test CLI help
        run: |
          chmod +x manage.sh
          ./manage.sh --help
